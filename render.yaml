services:
  - type: web
    name: libreria-m7
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn Libreria.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: libreria-db
          property: connectionString

databases:
  - name: libreria-db
    region: oregon
    plan: free