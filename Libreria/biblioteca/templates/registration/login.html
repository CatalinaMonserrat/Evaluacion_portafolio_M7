{% extends "base.html" %}
{% block title %}Ingresar · Librería{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 520px;">
    <h1 class="mb-3">Ingresar</h1>

    {% if form.errors %}
    <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" autofocus required class="form-control"
                value="{{ form.username.value|default:'' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" required class="form-control">
        </div>

        <button class="btn btn-primary w-100" type="submit">Ingresar</button>
    </form>

    <p class="mt-3 text-muted small">
        ¿Olvidaste tu contraseña? Usa <code>django.contrib.auth</code> para recuperar.
    </p>
</div>
{% endblock %}
