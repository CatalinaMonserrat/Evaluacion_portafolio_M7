{% extends "base.html" %}
{% block content %}
<h1>{{ libro.titulo }}</h1>
<p><strong>Autor:</strong> {{ libro.autor }}</p>
<p><strong>ISBN:</strong> {{ libro.isbn }}</p>
<p><strong>Precio:</strong> ${{ libro.precio }}</p>
<p><strong>Stock:</strong> {{ libro.stock }}</p>
<a href="{% url 'biblioteca:libro_editar' libro.id %}">Editar</a> ·
<a href="{% url 'biblioteca:libro_lista' %}">Volver</a>
{% endblock %}
